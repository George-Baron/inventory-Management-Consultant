<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workspace | Asotech Business Advisory</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="app">
  <aside class="side" id="side">
    <a class="brand" href="/"><span class="brand-mark">A</span><span>Asotech</span></a>
    <div class="who">
      <strong id="whoName">...</strong>
      <span id="whoRole" class="tag"></span>
    </div>
    <nav id="sideNav" aria-label="Workspace"></nav>
    <div class="side-foot">
      <button class="btn btn-ghost btn-sm" id="pwBtn" type="button">Change password</button>
      <button class="btn btn-ghost btn-sm" id="logoutBtn" type="button">Sign out</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="menu-toggle" id="sideToggle" type="button">Menu</button>
      <h1 id="viewTitle">Workspace</h1>
    </header>
    <div id="view" class="view" tabindex="-1"></div>
  </div>

  <dialog id="dlg">
    <form method="dialog" id="dlgForm">
      <h3 id="dlgTitle"></h3>
      <div id="dlgNotice" class="notice" role="alert"></div>
      <div id="dlgBody"></div>
      <div class="dlg-actions">
        <button class="btn btn-ghost btn-sm" type="button" id="dlgCancel">Cancel</button>
        <button class="btn btn-primary btn-sm" type="submit" id="dlgSave">Save</button>
      </div>
    </form>
  </dialog>

  <script src="/js/app.js" defer></script>
</body>
</html>
