<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff login | {{SITE_NAME}}</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>
{{HEADER}}
<main>
  <div class="auth-box">
    <h2 style="font-size:1.8rem">Staff login</h2>
    <p style="color:var(--muted)">Sign in with the email and password your administrator gave you.</p>
    <div id="loginNotice" class="notice" role="alert"></div>
    <form id="loginForm">
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary" style="width:100%" type="submit">Sign in</button>
    </form>
    <p style="margin:18px 0 0;font-size:.88rem;color:var(--muted)">Forgot your password? Ask your administrator to reset it.</p>
  </div>
</main>
{{FOOTER}}
<script src="/js/login.js" defer></script>
</body>
</html>
